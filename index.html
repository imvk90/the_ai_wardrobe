<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVE // Secure Digital Wardrobe</title>
    <meta name="description" content="ARCHIVE – Your AI-powered secure digital wardrobe. Organize, style, and pair your fits with a futuristic interface.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff2d7b;
            --neon-cyan: #00f0ff;
            --neon-violet: #b44dff;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.15);
            --card-radius: 24px;
            --section-padding: 0 clamp(20px, 5vw, 60px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        /* ═══════════════════════════════════════════
           DYNAMIC AURORA MESH BACKGROUND
        ═══════════════════════════════════════════ */
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #08050f;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Cyberpunk subtle grid overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating ambient neon blobs */
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--neon-pink), transparent 70%);
            top: -10%; left: -10%;
            animation: blobDrift1 20s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--neon-cyan), transparent 70%);
            bottom: -15%; right: -10%;
            animation: blobDrift2 25s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--neon-violet), transparent 70%);
            top: 40%; left: 50%;
            animation: blobDrift3 18s ease-in-out infinite alternate;
        }
        @keyframes blobDrift1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30vw, 20vh) scale(1.3); }
        }
        @keyframes blobDrift2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-25vw, -15vh) scale(1.2); }
        }
        @keyframes blobDrift3 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-20vw, 25vh) scale(0.8); }
        }

        /* ═══════════════════════════════════════════
           3D HOLOGRAPHIC LOGIN SCREEN
        ═══════════════════════════════════════════ */
        #auth-overlay {
            position: fixed; inset: 0;
            background: rgba(8, 5, 15, 0.6);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            perspective: 1200px;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #auth-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .auth-card {
            width: 100%; max-width: 440px;
            padding: 50px 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            position: relative;
            overflow: hidden;
            text-align: center;
            box-shadow:
                0 40px 80px rgba(0,0,0,0.5),
                0 0 60px rgba(255, 45, 123, 0.08),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transform-style: preserve-3d;
        }

        /* Holographic shimmer sweep */
        .auth-card::before {
            content: '';
            position: absolute; inset: -50%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(0, 240, 255, 0.06) 10%,
                transparent 20%,
                rgba(255, 45, 123, 0.06) 30%,
                transparent 40%,
                rgba(180, 77, 255, 0.06) 50%,
                transparent 60%
            );
            animation: holoSweep 8s linear infinite;
            pointer-events: none;
        }
        @keyframes holoSweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Neon border glow pulse */
        .auth-card::after {
            content: '';
            position: absolute; inset: -1px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan), var(--neon-violet), var(--neon-pink));
            background-size: 400% 400%;
            animation: borderGlow 6s ease infinite;
            z-index: -1;
            opacity: 0.4;
            filter: blur(1px);
        }
        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .auth-logo {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 8px;
        }
        .auth-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        /* Neon-bordered inputs */
        .input-group {
            position: relative;
            margin-bottom: 22px;
        }
        .input-group label {
            position: absolute;
            left: 18px; top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-group input {
            width: 100%;
            padding: 18px 18px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.03);
            background: rgba(255,255,255,0.06);
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 6px;
            font-size: 9px;
            color: var(--neon-cyan);
        }
        .input-group input::placeholder { color: transparent; }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
            color: #fff;
            border: none;
            border-radius: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 40px rgba(255, 45, 123, 0.3);
            position: relative;
            overflow: hidden;
        }
        .auth-btn::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .auth-btn:hover::before { transform: translateX(100%); }
        .auth-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 45, 123, 0.4);
        }
        .auth-btn:active { transform: translateY(0) scale(0.98); }

        .auth-toggle {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: color 0.3s;
        }
        .auth-toggle span {
            color: var(--neon-cyan);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .auth-toggle:hover { color: rgba(255,255,255,0.8); }

        .auth-error {
            color: var(--neon-pink);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 18px;
            letter-spacing: 0.5px;
        }

        /* ═══════════════════════════════════════════
           GLASSMORPHIC HEADER
        ═══════════════════════════════════════════ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px clamp(20px, 5vw, 60px);
            background: rgba(8, 5, 15, 0.6);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand p {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--neon-pink);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex; gap: 12px; align-items: center;
        }

        .glass-btn {
            padding: 11px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border-light);
            color: #fff;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        .glass-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
        }
        .glass-btn.primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
            border: none;
            box-shadow: 0 8px 25px rgba(255, 45, 123, 0.3);
        }
        .glass-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 45, 123, 0.4);
        }
        .glass-btn.danger:hover {
            background: rgba(255, 45, 123, 0.3);
            border-color: var(--neon-pink);
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ═══════════════════════════════════════════
           AI STYLIST BOX
        ═══════════════════════════════════════════ */
        .stylist-box {
            margin: 30px clamp(20px, 5vw, 60px) 0;
            padding: 30px 35px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .stylist-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink));
            border-radius: 4px 0 0 4px;
        }

        .stylist-box h4 {
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #styling-output {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
            max-width: 600px;
        }

        .stylist-action-btn {
            padding: 14px 30px;
            background: linear-gradient(135deg, #fff, #e0e0e5);
            color: var(--neon-pink);
            border: none;
            border-radius: 50px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        .stylist-action-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,255,255,0.15);
        }

        /* ═══════════════════════════════════════════
           CATEGORY PILLS
        ═══════════════════════════════════════════ */
        .categories {
            display: flex;
            gap: 12px;
            padding: 35px clamp(20px, 5vw, 60px) 25px;
            overflow-x: auto;
            scrollbar-width: none;
            z-index: 1;
            position: relative;
        }
        .categories::-webkit-scrollbar { display: none; }

        .pill {
            padding: 11px 26px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.5);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
            user-select: none;
        }
        .pill:hover {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            border-color: rgba(255,255,255,0.15);
        }
        .pill.active {
            background: #fff;
            color: #08050f;
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.15);
            font-weight: 700;
        }

        /* ═══════════════════════════════════════════
           WARDROBE GRID & CARDS
        ═══════════════════════════════════════════ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 10px clamp(20px, 5vw, 60px) 80px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            padding: 14px;
            position: relative;
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .card:hover {
            border-color: rgba(255,255,255,0.18);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(0, 240, 255, 0.05);
        }

        .card .img-container {
            width: 100%;
            height: 340px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .card .img-container img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover .img-container img {
            transform: scale(1.06);
        }

        .card .badge {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(255, 45, 123, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            z-index: 2;
        }

        .card .delete-btn {
            position: absolute;
            top: 12px; left: 12px;
            width: 36px; height: 36px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            z-index: 2;
            opacity: 0;
        }
        .card:hover .delete-btn { opacity: 1; }
        .card .delete-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            border-color: transparent;
            transform: scale(1.15);
        }

        .card .info {
            padding: 20px 8px 8px;
            text-align: center;
        }
        .card .info h3 {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .card .info p {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .try-on-btn {
            margin-top: 18px;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 45, 123, 0.25);
        }
        .try-on-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 45, 123, 0.4);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }
        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-state h3 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 14px;
            color: rgba(255,255,255,0.2);
        }

        /* ═══════════════════════════════════════════
           HOLOGRAPHIC SCANNER LOADER
        ═══════════════════════════════════════════ */
        #loader {
            display: none;
            position: fixed; inset: 0;
            background: rgba(8, 5, 15, 0.85);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            z-index: 1500;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #loader.active { display: flex; }

        .scanner-box {
            width: 160px; height: 200px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        }
        .scanner-box .scan-line {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 60px var(--neon-cyan);
            animation: scanDown 2s ease-in-out infinite;
        }
        @keyframes scanDown {
            0%, 100% { top: 0; opacity: 1; }
            50% { top: calc(100% - 3px); opacity: 0.7; }
        }
        .scanner-box .scan-corners {
            position: absolute; inset: 8px;
            border: 2px solid transparent;
            border-radius: 8px;
        }
        .scanner-box .scan-corners::before,
        .scanner-box .scan-corners::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border-color: var(--neon-cyan);
            border-style: solid;
        }
        .scanner-box .scan-corners::before {
            top: 0; left: 0;
            border-width: 2px 0 0 2px;
            border-radius: 4px 0 0 0;
        }
        .scanner-box .scan-corners::after {
            bottom: 0; right: 0;
            border-width: 0 2px 2px 0;
            border-radius: 0 0 4px 0;
        }
        .scan-corners-extra::before {
            top: 0; right: 0 !important; left: auto !important;
            border-width: 2px 2px 0 0 !important;
            border-radius: 0 4px 0 0 !important;
        }
        .scan-corners-extra::after {
            bottom: 0; left: 0 !important; right: auto !important;
            border-width: 0 0 2px 2px !important;
            border-radius: 0 0 0 4px !important;
        }

        #loader .loader-text {
            margin-top: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            animation: textFlicker 1.5s ease infinite;
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ═══════════════════════════════════════════
           ADD OBJECT MODAL
        ═══════════════════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(8, 5, 15, 0.7);
            backdrop-filter: blur(25px);
            z-index: 1800;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: linear-gradient(160deg, rgba(30, 20, 50, 0.95), rgba(15, 10, 30, 0.98));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            animation: modalSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalSlideIn {
            from { transform: translateY(40px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-card h3 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-card .preview-img {
            width: 100%;
            height: 200px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .modal-card input,
        .modal-card select {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.3s;
            -webkit-appearance: none;
        }
        .modal-card input:focus,
        .modal-card select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }
        .modal-card select option {
            background: #1a1025;
            color: #fff;
        }

        .modal-actions {
            display: flex; gap: 12px; margin-top: 10px;
        }
        .modal-actions button {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .modal-actions .cancel-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .modal-actions .cancel-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .modal-actions .save-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-violet));
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 45, 123, 0.3);
        }
        .modal-actions .save-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255, 45, 123, 0.4); }

        /* ═══════════════════════════════════════════
           AI OUTFIT PAIRING MODAL
        ═══════════════════════════════════════════ */
        .outfit-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }
        .outfit-grid .outfit-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
        }
        .outfit-grid .outfit-item img {
            width: 100%; height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }
        .outfit-grid .outfit-item p {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .outfit-description {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
            text-align: center;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .outfit-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .outfit-header .outfit-name {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .outfit-header .outfit-vibe {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 6px;
        }

        /* ═══════════════════════════════════════════
           VIRTUAL TRY-ON MODAL
        ═══════════════════════════════════════════ */
        .tryon-garment-preview {
            text-align: center;
            margin-bottom: 20px;
        }
        .tryon-garment-preview img {
            width: 100%; height: 180px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .tryon-garment-preview p {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .tryon-upload-area {
            display: block;
            border: 2px dashed rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .tryon-upload-area:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.03);
        }
        .tryon-upload-placeholder span {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
        }
        .tryon-upload-placeholder p {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tryon-person-preview {
            width: 100%; height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }
        .tryon-result-img {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .tryon-result-msg {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        /* ═══════════════════════════════════════════
           NOTIFICATION TOAST
        ═══════════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 30px; right: 30px;
            background: rgba(20, 15, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: 3px solid var(--neon-cyan);
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            z-index: 3000;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            max-width: 350px;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--neon-pink); }

        /* ═══════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════ */
        @media (max-width: 768px) {
            .stylist-box { flex-direction: column; text-align: center; gap: 20px; }
            .header-actions { gap: 8px; }
            .glass-btn { padding: 10px 16px; font-size: 10px; letter-spacing: 1px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
            .card .img-container { height: 280px; }
            .modal-card { padding: 30px 25px; }
            .outfit-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .header-actions .glass-btn.hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <!-- Ambient Neon Blobs -->
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>

    <!-- ═══════ 3D HOLOGRAPHIC LOGIN ═══════ -->
    <div id="auth-overlay">
        <div class="auth-card" id="auth-card-tilt">
            <div class="auth-logo">Archive</div>
            <h2 id="auth-title">System Entry</h2>
            <p class="auth-subtitle" id="auth-subtitle">Authenticate to access your wardrobe</p>
            <p class="auth-error" id="auth-error"></p>
            <div class="input-group">
                <input type="text" id="auth-username" placeholder="Username" autocomplete="off" />
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="Password" />
                <label>Password</label>
            </div>
            <button class="auth-btn" id="auth-submit-btn" onclick="handleAuthSubmit()">Login</button>
            <p class="auth-toggle" id="auth-toggle-text" onclick="toggleAuthMode()">New operator? <span>Create Account</span></p>
        </div>
    </div>

    <!-- ═══════ HOLOGRAPHIC SCANNER LOADER ═══════ -->
    <div id="loader">
        <div class="scanner-box">
            <div class="scan-line"></div>
            <div class="scan-corners"></div>
            <div class="scan-corners scan-corners-extra"></div>
        </div>
        <p class="loader-text">Analyzing Fabric...</p>
    </div>

    <!-- ═══════ VIRTUAL TRY-ON MODAL ═══════ -->
    <div class="modal-overlay" id="tryon-modal">
        <div class="modal-card">
            <h3>Virtual Try-On</h3>
            <div class="tryon-garment-preview">
                <img id="tryon-garment-img" src="" alt="Garment" />
                <p id="tryon-garment-name"></p>
            </div>
            <label class="tryon-upload-area" id="tryon-upload-area">
                <input type="file" id="tryon-person-input" accept="image/*" hidden />
                <div class="tryon-upload-placeholder" id="tryon-upload-placeholder">
                    <span>📸</span>
                    <p>Upload Your Full-Body Photo</p>
                </div>
                <img class="tryon-person-preview" id="tryon-person-preview" src="" alt="" style="display:none" />
            </label>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeTryonModal()">Cancel</button>
                <button class="save-btn" id="tryon-submit-btn" onclick="submitTryon()" disabled>Try It On ✨</button>
            </div>
        </div>
    </div>

    <!-- ═══════ TRY-ON RESULT MODAL ═══════ -->
    <div class="modal-overlay" id="tryon-result-modal">
        <div class="modal-card">
            <h3>Try-On Result</h3>
            <img class="tryon-result-img" id="tryon-result-img" src="" alt="Try-On Result" />
            <p class="tryon-result-msg" id="tryon-result-msg"></p>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeTryonResult()" style="flex:1;">Close</button>
            </div>
        </div>
    </div>

    <!-- ═══════ AI OUTFIT MODAL ═══════ -->
    <div class="modal-overlay" id="outfit-modal">
        <div class="modal-card">
            <h3>AI Styled Outfit</h3>
            <div class="outfit-header" id="outfit-header">
                <div class="outfit-name" id="outfit-name"></div>
                <div class="outfit-vibe" id="outfit-vibe"></div>
            </div>
            <div class="outfit-grid" id="outfit-grid-content"></div>
            <div class="outfit-description" id="outfit-description"></div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeOutfitModal()" style="flex:1;">Close</button>
                <button class="save-btn" onclick="rerollOutfit()" style="flex:1;">Re-Roll ✨</button>
            </div>
        </div>
    </div>

    <!-- ═══════ NOTIFICATION TOAST ═══════ -->
    <div class="toast" id="toast"></div>

    <!-- ═══════ DASHBOARD ═══════ -->
    <header>
        <div class="brand">
            <h1 id="user-header-title">Archive ✨</h1>
            <p id="item-count">0 items indexed</p>
        </div>
        <div class="header-actions">
            <button class="glass-btn danger hide-mobile" onclick="logoutUser()">Logout</button>
            <div class="upload-btn-wrapper">
                <button class="glass-btn primary">+ Add Object</button>
                <input type="file" id="file-uploader" accept="image/*" />
            </div>
        </div>
    </header>

    <div class="stylist-box">
        <div>
            <h4>AI Stylist Engine</h4>
            <p id="styling-output">Upload items & let the engine curate your perfect outfit pairing...</p>
        </div>
        <button class="stylist-action-btn" onclick="getAIRecommendation()">Pair Objects</button>
    </div>

    <div class="categories">
        <button class="pill active" onclick="filterCategory('All', this)">All Items</button>
        <button class="pill" onclick="filterCategory('Tops', this)">Tops</button>
        <button class="pill" onclick="filterCategory('Bottoms', this)">Bottoms</button>
        <button class="pill" onclick="filterCategory('Outerwear', this)">Outerwear</button>
        <button class="pill" onclick="filterCategory('Shoes', this)">Shoes</button>
    </div>

    <div class="grid" id="closet-grid"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
